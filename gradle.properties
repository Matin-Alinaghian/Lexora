# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compile daemon memory settings (fixes unexpected daemon termination)
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Run the Kotlin compiler inside the Gradle daemon instead of a separate
# process - avoids Kotlin daemon crashes on startup (error code 0)
kotlin.compiler.execution.strategy=in-process

# AndroidX package structure to make it clearer which packages are
# bundled with the Android operating system and which are packaged
# with your app's APK
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the library's resources, rather than including them all in the root
# application's R class
android.nonTransitiveRClass=true

# Enable Gradle's parallel execution
org.gradle.parallel=true

# Enable Build Cache
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Silence noisy daemon performance warnings
org.gradle.daemon.performance.disable-logging=true
